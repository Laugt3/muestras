<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALERO · Toldos a medida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rethink+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1410;--paper:#fbf4ec;--mute:#7b6a5f;--acc:#e8572a;--line:rgba(29,20,16,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 'Rethink Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 22px;color:#fff}
.logo{font:400 17px 'Michroma';letter-spacing:.14em}
.top a{font-size:14px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);padding:8px 16px;border-radius:999px}
.scene{position:relative;height:100svh;min-height:640px;overflow:hidden;touch-action:none;user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.copy{position:absolute;left:22px;right:22px;top:76px;color:#fff;z-index:3;pointer-events:none}
.copy h1{font:400 clamp(26px,7.4vw,56px)/1.08 'Michroma';letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 24px rgba(80,20,0,.25)}
.copy p{margin-top:10px;font-size:15px;max-width:30ch;color:#fff3e8;text-shadow:0 1px 10px rgba(80,20,0,.35)}
.panel{position:absolute;left:12px;right:12px;bottom:12px;z-index:4;background:rgba(251,244,236,.95);backdrop-filter:blur(14px);border-radius:24px;padding:14px 16px 14px;box-shadow:0 30px 60px -20px rgba(60,20,0,.45)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row .l{font-size:13px;color:var(--mute)}
.price{font:400 22px 'Michroma';letter-spacing:.01em;white-space:nowrap}
.meta{font-size:14px;color:var(--mute)}
.sw{display:flex;gap:10px;margin:10px 0 4px}
.sw button{width:38px;height:38px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button[aria-pressed=true]:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,30%),#e3d6ca var(--p,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25),0 0 0 6px rgba(232,87,42,.18)}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;margin-top:12px;text-decoration:none}
.wa svg{width:20px;height:20px}
.hint{position:absolute;right:18px;top:228px;z-index:3;color:#fff;font-size:13px;background:rgba(29,20,16,.45);backdrop-filter:blur(6px);padding:7px 12px;border-radius:999px;pointer-events:none}
.foot{padding:22px;font-size:13px;color:var(--mute);text-align:center}

@media (min-width:900px){
 .scene{height:100vh;min-height:720px;background:var(--paper)}
 .scene>svg{left:auto;right:0;width:52%}
 .top{color:var(--ink);padding:26px 4vw}
 .top a{color:var(--ink);border-color:rgba(29,20,16,.3)}
 .copy{left:4vw;right:54%;top:20vh;color:var(--ink)}
 .copy h1{font-size:clamp(34px,3.6vw,58px);text-shadow:none}
 .copy p{color:var(--mute);text-shadow:none;font-size:18px;margin-top:18px}
 .panel{left:4vw;right:auto;width:min(440px,42vw);bottom:auto;top:calc(20vh + 230px);box-shadow:0 30px 60px -30px rgba(60,20,0,.35);border:1px solid var(--line)}
 .hint{right:auto;left:72%;top:52vh}
}
</style>
</head>
<body>
<header class="top"><span class="logo">ALERO</span><a href="#">Showroom</a></header>
<section class="scene" id="scene">
 <svg id="svg" viewBox="0 0 390 693" preserveAspectRatio="xMidYMid slice"></svg>
 <div class="copy"><h1>Sombra a tu medida</h1><p>Toldos de brazo invisible, motorizados y a medida. Deslizá y miralo abrirse.</p></div>
 <div class="hint" id="hint">Arrastrá para abrir</div>
 <div class="panel">
  <div class="row"><span class="l" id="lname">Lona rayada naranja</span><span class="meta" id="dims"></span></div>
  <div class="sw" id="sw"></div>
  <input type="range" id="rng" min="0" max="100" value="30" aria-label="Abrir el toldo">
  <div class="row" style="margin-top:6px"><span class="l">Instalado, con motor</span><span class="price" id="price"></span></div>
  <a class="wa" id="wa" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.9 2.9 4.5 4 1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.3l-.4-.3Z"/></svg>Pedir este toldo por WhatsApp</a>
 </div>
</section>
<div class="foot">Marca de ejemplo. Web hecha por NIMBRA.</div>
<script>
const L=[{k:'naranja',n:'Lona rayada naranja',a:'#e8572a',b:'#fbf1e6',st:1},{k:'verde',n:'Lona rayada verde',a:'#2f5d4a',b:'#f4efe4',st:1},{k:'arena',n:'Lona lisa arena',a:'#d9c3a5',b:'#d9c3a5',st:0},{k:'grafito',n:'Lona lisa grafito',a:'#33302d',b:'#33302d',st:0}];
const S={v:30,l:'naranja'};
const $=id=>document.getElementById(id);
$('sw').innerHTML=L.map(x=>`<button data-k="${x.k}" aria-label="${x.n}" style="background:${x.st?`repeating-linear-gradient(90deg,${x.a} 0 8px,${x.b} 8px 16px)`:x.a}"></button>`).join('');
const W=390,H=693;
function scene(){
 const v=S.v/100,l=L.find(x=>x.k===S.l);
 // fachada
 const wallTop=214,wallBot=405,winL=62,winR=328,winT=282,winB=405;
 const ax0=winL-14,ax1=winR+14,ay=winT-22; // eje del toldo
 const proj=v*120; // salida en px
 const fy=ay+proj*.62, fx0=ax0-proj*.42, fx1=ax1+proj*.42; // borde delantero en perspectiva
 const sunY=150+ (1-v)*10;
 let s=`<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3a6e"/><stop offset=".45" stop-color="#e9765a"/><stop offset=".8" stop-color="#ffc58a"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#ffd59a"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1d18"/><stop offset="1" stop-color="#4a2f22"/></linearGradient>
 <radialGradient id="lamp" cx=".5" cy=".3" r=".6"><stop offset="0" stop-color="#ffc979" stop-opacity=".9"/><stop offset="1" stop-color="#ffc979" stop-opacity="0"/></radialGradient>
 <pattern id="tile" width="26" height="12" patternUnits="userSpaceOnUse"><rect width="26" height="12" fill="#c9a98d"/><path d="M0 12H26M13 0V12" stroke="#b8957a" stroke-width="1"/></pattern>
 <pattern id="str" width="${l.st?24:12}" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="${l.b}"/>${l.st?`<rect width="12" height="12" fill="${l.a}"/>`:''}</pattern>
 <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
 </defs>`;
 s+=`<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
 s+=`<circle cx="300" cy="${sunY}" r="120" fill="url(#sun)"/><circle cx="300" cy="${sunY}" r="26" fill="#fff1d2"/>`;
 // edificios de fondo
 s+=`<path d="M0 230h40v-60h38v40h30v-80h44v100h20v-50h36v260H0Z" fill="#7a4a5c" opacity=".35"/>`;
 // pared
 s+=`<rect x="0" y="${wallTop}" width="${W}" height="${wallBot-wallTop+40}" fill="#f2e3d3"/>`;
 s+=`<rect x="0" y="${wallTop}" width="${W}" height="10" fill="#e4cfba"/>`;
 // ventanal con luz cálida
 s+=`<rect x="${winL}" y="${winT}" width="${winR-winL}" height="${winB-winT}" fill="url(#glass)"/>`;
 s+=`<rect x="${winL}" y="${winT}" width="${winR-winL}" height="${winB-winT}" fill="url(#lamp)" opacity="${.35+.55*v}"/>`;
 s+=`<path d="M${(winL+winR)/2} ${winT}V${winB}M${winL} ${winT}h${winR-winL}" stroke="#1d1410" stroke-width="5"/>`;
 s+=`<circle cx="${(winL+winR)/2}" cy="${winT+40}" r="9" fill="#ffd18a" opacity="${.5+.5*v}"/><path d="M${(winL+winR)/2} ${winT}v31" stroke="#1d1410" stroke-width="1.5"/>`;
 // piso de terraza
 s+=`<rect x="0" y="${winB+18}" width="${W}" height="${H-winB}" fill="url(#tile)"/>`;
 s+=`<rect x="0" y="${winB+10}" width="${W}" height="10" fill="#b48b6c"/>`;
 // sombra del toldo sobre el piso (crece con la salida)
 if(v>0.02){const sy=winB+18,sh=proj*.95; s+=`<path d="M${ax0+30} ${sy} L${ax1+30} ${sy} L${fx1+60} ${sy+sh} L${fx0+60} ${sy+sh}Z" fill="#3b2316" opacity="${.28*v+.05}"/>`}
 // mesa y sillas (siluetas)
 const ty=winB+44;
 s+=`<g fill="#2a1c15" opacity=".92"><rect x="160" y="${ty}" width="70" height="6" rx="3"/><rect x="192" y="${ty}" width="6" height="52"/><rect x="176" y="${ty+50}" width="38" height="5" rx="2"/>
 <path d="M118 ${ty-10}h8v66h-4v-30h-24v30h-4v-36h24Z"/><path d="M272 ${ty-10}h-8v66h4v-30h24v30h4v-36h-24Z"/></g>`;
 s+=`<g><path d="M24 ${winB-4}h40l-6 34h-28Z" fill="#c4643c"/><circle cx="44" cy="${winB-30}" r="26" fill="#3f6b48"/><circle cx="30" cy="${winB-48}" r="16" fill="#4f7d55"/><path d="M326 ${winB-4}h40l-6 34h-28Z" fill="#c4643c"/><circle cx="346" cy="${winB-34}" r="22" fill="#3f6b48"/></g>`;
 // cofre del toldo
 s+=`<rect x="${ax0-6}" y="${ay-12}" width="${ax1-ax0+12}" height="16" rx="6" fill="#efe9e2"/><rect x="${ax0-6}" y="${ay+1}" width="${ax1-ax0+12}" height="4" fill="#d8cfc4"/>`;
 // lona
 if(v>0.01){
  s+=`<path d="M${ax0} ${ay} L${ax1} ${ay} L${fx1} ${fy} L${fx0} ${fy}Z" fill="url(#str)"/>`;
  s+=`<path d="M${ax0} ${ay} L${ax1} ${ay} L${fx1} ${fy} L${fx0} ${fy}Z" fill="url(#fold)"/>`;
  // faldón ondulado
  const n=12,wv=(fx1-fx0)/n;let d=`M${fx0} ${fy}`;for(let i=0;i<n;i++){d+=` L${fx0+wv*i} ${fy+16} Q${fx0+wv*(i+.5)} ${fy+24} ${fx0+wv*(i+1)} ${fy+16}`}d+=` L${fx1} ${fy}Z`;
  s+=`<path d="${d}" fill="url(#str)"/><path d="${d}" fill="#000" opacity=".12"/>`;
  s+=`<rect x="${fx0-3}" y="${fy-3}" width="${fx1-fx0+6}" height="6" rx="3" fill="#efe9e2"/>`;
  // brazos invisibles
  s+=`<path d="M${ax0+16} ${ay+4} L${fx0+18} ${fy}M${ax1-16} ${ay+4} L${fx1-18} ${fy}" stroke="#efe9e2" stroke-width="3" opacity=".7"/>`;
 }
 $('svg').innerHTML=s;
}
function ui(){
 const l=L.find(x=>x.k===S.l);const ancho=4,salida=Math.max(.5,+(S.v/100*3).toFixed(1));
 const p=38000+ancho*salida*2900+(l.st?1800:0);
 $('lname').textContent=l.n;$('dims').textContent=`${ancho} m × ${String(salida).replace('.',',')} m`;
 $('price').textContent='$ '+(Math.round(p/100)*100).toLocaleString('es-UY');
 $('rng').value=S.v;$('rng').style.setProperty('--p',S.v+'%');
 document.querySelectorAll('#sw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===S.l));
 $('wa').href='https://wa.me/?text='+encodeURIComponent(`Hola ALERO! Quiero este toldo:\n• ${l.n}\n• ${ancho} m de ancho × ${String(salida).replace('.',',')} m de salida\n• Con motor\nPrecio en la web: ${$('price').textContent}`);
 scene()}
document.querySelectorAll('#sw button').forEach(b=>b.onclick=()=>{S.l=b.dataset.k;ui()});
$('rng').oninput=e=>{S.v=+e.target.value;$('hint').style.display='none';ui()};
const sc=$('scene');let drag=false;
sc.addEventListener('pointerdown',e=>{if(e.target.closest('.panel'))return;drag=true;sc.setPointerCapture(e.pointerId)});
sc.addEventListener('pointermove',e=>{if(!drag)return;const r=sc.getBoundingClientRect();S.v=Math.round(Math.max(0,Math.min(100,(e.clientY-r.top-260)/2.4)));$('hint').style.display='none';ui()});
sc.addEventListener('pointerup',()=>drag=false);
ui();
if(!location.search.includes('shot')&&!matchMedia('(prefers-reduced-motion:reduce)').matches){S.v=0;ui();let t0=null;const go=t=>{t0??=t;const k=Math.min(1,(t-t0)/1600);S.v=Math.round(70*(1-Math.pow(1-k,3)));ui();if(k<1)requestAnimationFrame(go)};setTimeout(()=>requestAnimationFrame(go),600)}
</script>
</body>
</html>
