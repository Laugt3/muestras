:root{--naranja:#FF3B14;--tinta:#0E0B09;--claro:#FFF6F2;--humo:#9A918A;--ig:#3797F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--tinta);color:var(--claro);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 78% 40%,rgba(255,59,20,.22),transparent 60%),radial-gradient(900px 600px at 10% 100%,rgba(255,59,20,.08),transparent 60%);pointer-events:none}
.wrap{position:relative;min-height:100%;max-width:1240px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:1fr 430px;gap:72px;align-items:center}
.l h1{font-family:Archivo;font-weight:900;font-variation-settings:"wdth" 112;font-size:clamp(48px,6vw,88px);line-height:.9;letter-spacing:-.035em;text-transform:uppercase}
.l h1 .ed{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--naranja);margin-top:8px}
.l p.lead{font-size:20px;line-height:1.5;color:#CFC6BD;max-width:30ch;margin:28px 0 30px}
.feats{list-style:none;display:grid;gap:14px;max-width:440px}
.feats li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:16px;line-height:1.45;color:#E8E0D8}
.feats i{font-style:normal;width:34px;height:34px;border-radius:10px;background:rgba(255,59,20,.14);color:var(--naranja);display:grid;place-items:center;font-weight:700}
.try{margin-top:30px;font-size:14px;color:var(--humo)}
.lang{display:inline-flex;margin-top:22px;border:1px solid rgba(255,246,242,.2);border-radius:100px;overflow:hidden}
.lang button{font:600 13px Inter;background:none;color:var(--humo);border:0;padding:9px 16px;cursor:pointer}
.lang button.on{background:var(--claro);color:var(--tinta)}
.brand{display:flex;align-items:center;gap:10px;margin-top:40px;font-size:13px;color:var(--humo)}
.brand b{font-family:Archivo;font-weight:900;font-variation-settings:"wdth" 122;font-size:18px;letter-spacing:.01em;color:var(--claro)}
.brand b span{display:inline-block;width:.32em;height:.32em;background:var(--naranja);margin-left:2px}
/* teléfono */
.phone{width:430px;height:860px;background:#000;border-radius:58px;padding:13px;box-shadow:0 60px 120px -40px rgba(0,0,0,.9),0 0 0 2px #2a2623 inset}
.scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:5}
.status{height:46px;flex:none}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-bottom:1px solid #262626}
.hd .back{font-size:26px;color:#f5f5f5;line-height:1}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--naranja),#ffb199);display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;flex:none}
.hd b{display:block;font-size:15px;color:#f5f5f5;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.hd small{font-size:12px;color:#a8a8a8}
.th{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.th::-webkit-scrollbar{display:none}
.ts{align-self:center;font-size:11px;color:#8e8e8e;margin:6px 0 10px;font-weight:600}
.m{max-width:82%;font-size:15px;line-height:1.38;padding:10px 14px;border-radius:22px;white-space:pre-line;animation:pop .22s ease-out}
.m.in{align-self:flex-end;background:var(--ig);color:#fff;border-bottom-right-radius:6px}
.m.ag{align-self:flex-start;background:#262626;color:#f5f5f5;border-bottom-left-radius:6px}
.m.ag b{font-weight:700}
.m .card{margin-top:8px;background:#1a1a1a;border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.m .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.m .row.t{border-top:1px solid #3a3a3a;padding-top:6px;font-weight:700}
.typing{align-self:flex-start;background:#262626;border-radius:22px;padding:13px 16px;display:flex;gap:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:#8e8e8e;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 8px;justify-content:flex-end}
.qr button{font:600 13px Inter;color:#f5f5f5;background:transparent;border:1px solid #4a4a4a;border-radius:100px;padding:8px 13px;cursor:pointer;transition:.15s}
.qr button:hover{border-color:#f5f5f5}
.bar{flex:none;display:flex;gap:8px;align-items:center;margin:6px 12px 18px;border:1px solid #363636;border-radius:30px;padding:6px 6px 6px 16px}
.bar input{flex:1;background:none;border:0;color:#f5f5f5;font:15px Inter;outline:none;min-width:0}
.bar button{font:700 14px Inter;color:var(--ig);background:none;border:0;padding:8px 10px;cursor:pointer}
.note{font-size:12px;color:#7a7470;margin-top:14px;text-align:center}
@media(max-width:980px){.wrap{grid-template-columns:1fr;gap:36px;padding:28px 16px}.r{display:flex;flex-direction:column;align-items:center;order:-1}.l h1{font-size:44px}}
@media(max-width:480px){.phone{width:100%;height:78vh;min-height:600px;border-radius:40px;padding:8px}.scr{border-radius:32px}.notch{display:none}.status{height:14px}}
</style>

 const per=/primera quincena de enero|1ra quincena|1ra de enero|first half of january|1 al 15|1-15/.test(s)?'e1':/segunda quincena de enero|2da quincena|second half of january|16 al 31/.test(s)?'e2':/febrero|february|carnaval/.test(s)?'feb':/diciembre|december|fin de ano|new year|ano nuevo|navidad/.test(s)?'dic':/enero|january/.test(s)?'e2':null;
 if(per){st.per=per;parts.push(t(`Para la <b>${perLabel(per)}</b> todavía tengo disponibilidad 🙌`,`We still have availability for <b>${perLabel(per)}</b> 🙌`))}
 const gm=s.match(/(\d{1,2})\s*(personas|adultos|pax|people|guests|somos|de nosotros)/)||s.match(/somos\s*(\d{1,2})/)||s.match(/^(\d{1,2})\s*(o mas|or more)/);if(gm){st.g=parseInt(gm[1]);}
 if(/perro|gato|mascota|pet|dog|cat/.test(s)){st.pet=true;parts.push(t('Sí, aceptamos mascotas en las casas (no en los departamentos), con un depósito de US$ 200 que se devuelve.','Yes, pets are welcome in the houses (not the apartments), with a refundable US$ 200 deposit.'))}
 if(/garage|garaje|cochera|estacionamiento|parking/.test(s))parts.push(t('Todas tienen cochera o lugar para estacionar adentro.','All of them have a garage or a parking spot inside the property.'));
 if(/ropa de cama|sabanas|toallas|linens|towels|limpieza|cleaning/.test(s))parts.push(t('Se entregan con ropa de cama y toallas, y la limpieza de salida está incluida.','They come with bed linens and towels, and the final cleaning is included.'));
 if(/playa|mar|beach|cuadras|distancia|cerca/.test(s))parts.push(t('El departamento de La Brava está frente al mar; la casa de Manantiales queda a 3 cuadras de Bikini y el monoambiente de la Península a 2 de la playa.','The La Brava apartment is beachfront; the Manantiales house is 3 blocks from Bikini beach and the Peninsula studio is 2 blocks from the sand.'));
 if(/wifi|internet|aire|ac\b|aire acondicionado|piscina|pileta|pool|parrilla|barbacoa|bbq/.test(s)&&(/\?/.test(raw)||!D.temporada.h.some(x=>x.re.test(s))))parts.push(t('Todas tienen wifi y aire acondicionado. La casa de Manantiales tiene piscina y parrillero.','All have wifi and air conditioning. The Manantiales house has a pool and a barbecue area.'));
 if(/sena|reserva|deposito|deposit|como (se )?pago|forma de pago|tarjeta|transferencia|mercado pago/.test(s))parts.push(t('Se reserva con el 30% por transferencia o Mercado Pago, y el resto se paga al llegar.','You book with a 30% deposit by bank transfer or Mercado Pago, and pay the rest on arrival.'));
 if(/foto|video|ver (la|el|las)|photos|pictures/.test(s))parts.push(t('¡Claro! Te mando fotos y un video de cada una por acá. En la versión real van directo desde su catálogo.','Of course! I’ll send photos and a video of each one. In the real version they come straight from your listings.'));
 if(o.i.has('human'))return say(t(`Claro, le paso tu consulta a alguien de <b>${biz()}</b> con todo lo que hablamos. Te escribe enseguida 🙌`,`Of course, I’m passing this to someone at <b>${biz()}</b> with everything we covered. They’ll message you shortly 🙌`));
 const pk=s.length<60&&!/\?/.test(raw)?H.find(x=>x.re.test(s)):null;if(pk&&st.per){st.pick=pk;st.wait='name';return say(parts.concat(t(`¡Buena elección! <b>${pk.es}</b> para la ${perLabel(st.per)}: <b>US$ ${Math.round(pk.p*D.temporada.per.find(p=>p.k===st.per).f).toLocaleString('en-US')}</b>. ¿A nombre de quién lo aparto?`,`Great choice! <b>${pk.en}</b> for ${perLabel(st.per)}: <b>US$ ${Math.round(pk.p*D.temporada.per.find(p=>p.k===st.per).f).toLocaleString('en-US')}</b>. What name should I hold it under?`)).join('\n'))}
 if(o.i.has('thanks')&&!parts.length)return say(t('¡De nada! Cualquier cosa me escribís 😊','You’re welcome! Message me anytime 😊'));
 if(!st.per)return say(parts.concat(t('¿Para qué fecha buscás?','Which dates are you looking for?')).join('\n'),D.temporada.per.map(p=>t(p.es,p.en)));
 if(!st.g)return say(parts.concat(t('¿Cuántas personas van a ser?','How many people will be staying?')).join('\n'),[t('2 personas','2 people'),t('4 personas','4 people'),t('6 o más','6 or more')]);
 if(!st.shown){st.shown=true;let ok=H.filter(x=>x.cap>=st.g&&(!st.pet||x.pet));if(!ok.length)ok=H.filter(x=>x.cap>=st.g);return say(parts.concat(t(`Para ${st.g} personas te recomiendo:`,`For ${st.g} people I’d recommend:`)+tmpCard(ok,st.per)+t('\n¿Cuál te gusta? Te lo aparto 24 horas sin compromiso.','\nWhich one do you like? I can hold it for 24 hours, no commitment.')).join('\n'),ok.map(x=>t(x.es,x.en)))}
 return say(parts.length?parts.join('\n'):t('¿Querés que te aparte alguna? Decime cuál y la dejo reservada 24 horas.','Would you like me to hold one? Tell me which and I’ll keep it for 24 hours.'),H.map(x=>t(x.es,x.en)))}

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;restart()});
restart();
