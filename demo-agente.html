<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Asistente de IA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Demo del agente de IA de NIMBRA. Se adapta por URL:
   ?n=Nombre&t=salon|boutique&l=es|en  — precios de ejemplo, flujo guionado (sin backend). */
:root{--naranja:#FF3B14;--tinta:#0E0B09;--claro:#FFF6F2;--humo:#9A918A;--ig:#3797F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--tinta);color:var(--claro);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(1200px 700px at 78% 40%,rgba(255,59,20,.22),transparent 60%),radial-gradient(900px 600px at 10% 100%,rgba(255,59,20,.08),transparent 60%);pointer-events:none}
.wrap{position:relative;min-height:100%;max-width:1240px;margin:0 auto;padding:48px 32px;display:grid;grid-template-columns:1fr 430px;gap:72px;align-items:center}
.l h1{font-family:Archivo;font-weight:900;font-variation-settings:"wdth" 112;font-size:clamp(48px,6vw,88px);line-height:.9;letter-spacing:-.035em;text-transform:uppercase}
.l h1 .ed{display:block;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em;color:var(--naranja);margin-top:8px}
.l p.lead{font-size:20px;line-height:1.5;color:#CFC6BD;max-width:30ch;margin:28px 0 30px}
.feats{list-style:none;display:grid;gap:14px;max-width:440px}
.feats li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:16px;line-height:1.45;color:#E8E0D8}
.feats i{font-style:normal;width:34px;height:34px;border-radius:10px;background:rgba(255,59,20,.14);color:var(--naranja);display:grid;place-items:center;font-weight:700}
.try{margin-top:30px;font-size:14px;color:var(--humo)}
.lang{display:inline-flex;margin-top:22px;border:1px solid rgba(255,246,242,.2);border-radius:100px;overflow:hidden}
.lang button{font:600 13px Inter;background:none;color:var(--humo);border:0;padding:9px 16px;cursor:pointer}
.lang button.on{background:var(--claro);color:var(--tinta)}
.brand{display:flex;align-items:center;gap:10px;margin-top:40px;font-size:13px;color:var(--humo)}
.brand b{font-family:Archivo;font-weight:900;font-variation-settings:"wdth" 122;font-size:18px;letter-spacing:.01em;color:var(--claro)}
.brand b span{display:inline-block;width:.32em;height:.32em;background:var(--naranja);margin-left:2px}
/* teléfono */
.phone{width:430px;height:860px;background:#000;border-radius:58px;padding:13px;box-shadow:0 60px 120px -40px rgba(0,0,0,.9),0 0 0 2px #2a2623 inset}
.scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000;display:flex;flex-direction:column}
.notch{position:absolute;top:10px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:5}
.status{height:46px;flex:none}
.hd{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-bottom:1px solid #262626}
.hd .back{font-size:26px;color:#f5f5f5;line-height:1}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--naranja),#ffb199);display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;flex:none}
.hd b{display:block;font-size:15px;color:#f5f5f5;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.hd small{font-size:12px;color:#a8a8a8}
.th{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.th::-webkit-scrollbar{display:none}
.ts{align-self:center;font-size:11px;color:#8e8e8e;margin:6px 0 10px;font-weight:600}
.m{max-width:82%;font-size:15px;line-height:1.38;padding:10px 14px;border-radius:22px;white-space:pre-line;animation:pop .22s ease-out}
.m.in{align-self:flex-end;background:var(--ig);color:#fff;border-bottom-right-radius:6px}
.m.ag{align-self:flex-start;background:#262626;color:#f5f5f5;border-bottom-left-radius:6px}
.m.ag b{font-weight:700}
.m .card{margin-top:8px;background:#1a1a1a;border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.m .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.m .row.t{border-top:1px solid #3a3a3a;padding-top:6px;font-weight:700}
.typing{align-self:flex-start;background:#262626;border-radius:22px;padding:13px 16px;display:flex;gap:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:#8e8e8e;animation:dot 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 8px;justify-content:flex-end}
.qr button{font:600 13px Inter;color:#f5f5f5;background:transparent;border:1px solid #4a4a4a;border-radius:100px;padding:8px 13px;cursor:pointer;transition:.15s}
.qr button:hover{border-color:#f5f5f5}
.bar{flex:none;display:flex;gap:8px;align-items:center;margin:6px 12px 18px;border:1px solid #363636;border-radius:30px;padding:6px 6px 6px 16px}
.bar input{flex:1;background:none;border:0;color:#f5f5f5;font:15px Inter;outline:none;min-width:0}
.bar button{font:700 14px Inter;color:var(--ig);background:none;border:0;padding:8px 10px;cursor:pointer}
.note{font-size:12px;color:#7a7470;margin-top:14px;text-align:center}
@media(max-width:980px){.wrap{grid-template-columns:1fr;gap:36px;padding:28px 16px}.r{display:flex;flex-direction:column;align-items:center;order:-1}.l h1{font-size:44px}}
@media(max-width:480px){.phone{width:100%;height:78vh;min-height:600px;border-radius:40px;padding:8px}.scr{border-radius:32px}.notch{display:none}.status{height:14px}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="wrap">
  <section class="l">
    <h1><span id="h1a">El asistente de</span><span class="ed" id="h1b">tu negocio</span></h1>
    <p class="lead" id="lead"></p>
    <ul class="feats" id="feats"></ul>
    <div class="lang"><button data-l="es">Español</button><button data-l="en">English</button></div>
    <p class="try" id="try"></p>
    <div class="brand"><b>NIMBRA<span></span></b><span id="brandt"></span></div>
  </section>
  <section class="r">
    <div class="phone"><div class="scr">
      <div class="notch"></div><div class="status"></div>
      <div class="hd"><span class="back">‹</span><div class="av" id="av">N</div><div><b id="nm">Negocio</b><small id="sub"></small></div></div>
      <div class="th" id="th"></div>
      <div class="qr" id="qr"></div>
      <form class="bar" id="f"><input id="in" autocomplete="off"><button id="sendb"></button></form>
    </div></div>
    <p class="note" id="note"></p>
  </section>
</main>
<script>
const Q=new URLSearchParams(location.search);
const NAME=(Q.get('n')||'').trim()||null;
const TYPE=['boutique','rentals'].includes(Q.get('t'))?Q.get('t'):'salon';
let L=Q.get('l')==='en'?'en':'es';
const money=n=>'$'+n.toLocaleString('en-US');
// datos de ejemplo
const D={
 salon:{pk:[{k:'b',es:'Básico',en:'Basic',g:100,p:2900},{k:'p',es:'Plus',en:'Plus',g:150,p:4200},{k:'x',es:'Premium',en:'Premium',g:200,p:5900}],
   ex:[{es:'DJ e iluminación',en:'DJ & lighting',p:650},{es:'Decoración temática',en:'Themed décor',p:800},{es:'Fotografía y video',en:'Photo & video',p:1100}],
   free:{es:['sábado 14 de noviembre','viernes 20 de noviembre','sábado 5 de diciembre'],en:['Saturday, November 14','Friday, November 20','Saturday, December 5']},
   slots:{es:['jueves 6:00 pm','sábado 11:00 am','domingo 1:00 pm'],en:['Thursday 6:00 pm','Saturday 11:00 am','Sunday 1:00 pm']}},
 boutique:{cat:[{es:'Vestidos de XV',en:'Quinceañera gowns',r:'$650 – $1,800'},{es:'Vestidos de novia',en:'Wedding dresses',r:'$900 – $3,500'},{es:'Prom y damas',en:'Prom & bridesmaids',r:'$180 – $450'}],
   slots:{es:['jueves 6:00 pm','sábado 11:00 am','sábado 3:00 pm'],en:['Thursday 6:00 pm','Saturday 11:00 am','Saturday 3:00 pm']}},
 rentals:{it:[{es:'Brincolín (inflable) 13x13',en:'Bounce house 13x13',p:150},{es:'Combo con tobogán de agua',en:'Water slide combo',p:275},{es:'6 mesas + 50 sillas',en:'6 tables + 50 chairs',p:135},{es:'Carpa 20x20 instalada',en:'20x20 tent, set up',p:250}],
   pk:{es:'Paquete Fiesta: brincolín + 6 mesas + 50 sillas + mantelería',en:'Party Pack: bounce house + 6 tables + 50 chairs + linens',p:345,save:20},
   free:{es:['sábado 17 de octubre','domingo 18 de octubre','sábado 24 de octubre'],en:['Saturday, October 17','Sunday, October 18','Saturday, October 24']}}
};
const T={
 es:{h1a:'El asistente de',biz:'tu negocio',sub:'Asistente · responde al instante',ph:'Escribí un mensaje…',send:'Enviar',
  lead:{salon:'Contesta cada consulta de Instagram, WhatsApp y la web en segundos, cotiza la fiesta y deja la visita agendada. A cualquier hora.',boutique:'Contesta cada consulta de Instagram, WhatsApp y la web en segundos, muestra precios y talles y deja la cita de prueba agendada. A cualquier hora.',rentals:'Contesta cada consulta de Instagram, WhatsApp y la web en segundos: precio por artículo, disponibilidad para la fecha, envío según la zona y reserva con seña. A cualquier hora.'},
  feats:{salon:['Responde fecha, capacidad, paquetes y precio','Arma el presupuesto con invitados y extras','Agenda la visita al salón','Le pasa la conversación a una persona cuando hace falta'],boutique:['Responde precios, talles y disponibilidad','Pregunta fecha del evento y estilo','Agenda la cita de prueba','Le pasa la conversación a una persona cuando hace falta'],rentals:['Cotiza inflables, mesas, sillas y carpas al instante','Revisa la disponibilidad para la fecha','Calcula el envío por código postal','Deja la reserva tomada con seña']},
  try:'Probalo: escribí como si fueras un cliente o tocá las opciones.',brand:'· Demo hecha para',note:'Demo con precios y fechas de ejemplo. La versión real usa sus paquetes, su agenda y su forma de hablar.',
  ts:'HOY 11:47 PM'},
 en:{h1a:'The assistant for',biz:'your business',sub:'Assistant · replies instantly',ph:'Message…',send:'Send',
  lead:{salon:'Answers every Instagram, WhatsApp and website inquiry in seconds, quotes the party and books the venue tour. Any time of day.',boutique:'Answers every Instagram, WhatsApp and website inquiry in seconds, shares prices and sizes and books the fitting. Any time of day.',rentals:'Answers every Instagram, WhatsApp and website inquiry in seconds: item prices, availability for the date, delivery by ZIP code and a booking with deposit. Any time of day.'},
  feats:{salon:['Answers date, capacity, packages and price','Builds the quote with guests and add-ons','Books the venue tour','Hands the chat to a person when needed'],boutique:['Answers prices, sizes and availability','Asks for the event date and style','Books the fitting appointment','Hands the chat to a person when needed'],rentals:['Quotes bounce houses, tables, chairs and tents instantly','Checks availability for the date','Calculates delivery by ZIP code','Takes the booking with a deposit']},
  try:'Try it: type like a customer or tap the options.',brand:'· Demo built for',note:'Demo with sample prices and dates. The real version uses your packages, your calendar and your voice.',
  ts:'TODAY 11:47 PM'}
};
const th=document.getElementById('th'),qr=document.getElementById('qr');
let st={};const biz=()=>NAME||T[L].biz;
const t=(es,en)=>L==='es'?es:en;
function ui(){const x=T[L];document.documentElement.lang=L;
 h1a.textContent=x.h1a;h1b.textContent=biz();lead.textContent=x.lead[TYPE];
 feats.innerHTML=x.feats[TYPE].map((f,i)=>`<li><i>${i+1}</i><span>${f}</span></li>`).join('');
 document.getElementById('try').textContent=x.try;brandt.textContent=x.brand+' '+biz();note.textContent=x.note;
 nm.textContent=biz();av.textContent=biz().trim()[0].toUpperCase();sub.textContent=x.sub;
 document.getElementById('in').placeholder=x.ph;sendb.textContent=x.send;
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));}
const sc=()=>{th.scrollTop=th.scrollHeight};
function msg(html,who){const d=document.createElement('div');d.className='m '+who;d.innerHTML=html;th.appendChild(d);sc();return d}
function opts(list){qr.innerHTML='';list.forEach(([label,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{msg(esc(label),'in');qr.innerHTML='';fn()};qr.appendChild(b)});sc()}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let q=Promise.resolve();
function say(html,next,delay){q=q.then(()=>new Promise(res=>{const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span></span><span></span><span></span>';th.appendChild(ty);sc();setTimeout(()=>{ty.remove();msg(html,'ag');res()},delay||Math.min(1500,500+html.length*7))}));if(next)q=q.then(next);return q}
// ---------- flujo salón ----------
function menuS(){opts([[t('Precios y paquetes','Prices & packages'),pkgS],[t('¿Tienen fecha libre?','Is my date available?'),dateS],[t('Agendar visita','Book a tour'),tourS],[t('Hablar con una persona','Talk to a person'),human]])}
function startS(){say(t(`¡Hola! 👋 Soy el asistente de <b>${biz()}</b>. Te ayudo con fechas, paquetes y presupuesto para tu fiesta. ¿Qué estás planeando?`,`Hi! 👋 I'm the assistant for <b>${biz()}</b>. I can help with dates, packages and a quote for your event. What are you planning?`),()=>opts([[t('Quinceañera','Quinceañera'),()=>{st.ev=t('XV años','quinceañera');guestsS()}],[t('Boda','Wedding'),()=>{st.ev=t('boda','wedding');guestsS()}],[t('Cumpleaños / otro','Birthday / other'),()=>{st.ev=t('fiesta','party');guestsS()}]]))}
function guestsS(){say(t(`¡Qué lindo! ¿Más o menos cuántos invitados van a ser?`,`Love it! About how many guests are you expecting?`),()=>opts([['~100',()=>{st.g=100;pkgS()}],['~150',()=>{st.g=150;pkgS()}],['200+',()=>{st.g=200;pkgS()}]]))}
function pkgS(){const P=D.salon.pk;const rec=st.g?P.find(p=>p.g>=st.g)||P[2]:null;
 const rows=P.map(p=>`<div class="row"><span>${t(p.es,p.en)} · ${t('hasta','up to')} ${p.g}</span><span>${money(p.p)}</span></div>`).join('');
 say(t(`Estos son los paquetes (incluyen salón 6 h, mesas, mantelería y personal):`,`Here are our packages (6-hour venue, tables, linens and staff included):`)+`<div class="card">${rows}</div>`+(rec?t(`\nPara ${st.g} invitados te recomiendo el <b>${rec.es}</b>.`,`\nFor ${st.g} guests I'd suggest <b>${rec.en}</b>.`):''),()=>{st.pk=rec||P[1];opts([[t('Armar presupuesto','Build my quote'),extrasS],[t('¿Tienen fecha libre?','Is my date available?'),dateS],[t('Agendar visita','Book a tour'),tourS]])})}
function extrasS(){st.pk=st.pk||D.salon.pk[1];st.ex=st.ex||[];const E=D.salon.ex;
 say(t(`¿Querés sumar algún extra al paquete ${st.pk.es}?`,`Want to add any extras to the ${st.pk.en} package?`),()=>opts([...E.map((e,i)=>[t(e.es,e.en)+' +'+money(e.p),()=>{if(!st.ex.includes(i))st.ex.push(i);extrasS()}]),[t('Listo, ver total','Done, show total'),quoteS]]))}
function quoteS(){const E=D.salon.ex;let tot=st.pk.p;let rows=`<div class="row"><span>${t('Paquete','Package')} ${t(st.pk.es,st.pk.en)}</span><span>${money(st.pk.p)}</span></div>`;(st.ex||[]).forEach(i=>{tot+=E[i].p;rows+=`<div class="row"><span>${t(E[i].es,E[i].en)}</span><span>${money(E[i].p)}</span></div>`});rows+=`<div class="row t"><span>Total</span><span>${money(tot)}</span></div>`;
 say(t(`Este es tu presupuesto estimado 👇`,`Here's your estimated quote 👇`)+`<div class="card">${rows}</div>`+t(`\nSe reserva con el 30% y el resto hasta 15 días antes.`,`\nA 30% deposit reserves the date; the balance is due 15 days before.`),()=>opts([[t('¿Tienen fecha libre?','Is my date available?'),dateS],[t('Agendar visita','Book a tour'),tourS]]))}
function dateS(){const F=D.salon.free[L];say(t(`Para los próximos meses tenemos libres: <b>${F.join('</b>, <b>')}</b>. ¿Te sirve alguna?`,`Coming up we have open: <b>${F.join('</b>, <b>')}</b>. Does one work for you?`),()=>opts([...F.map(f=>[f,()=>{st.date=f;say(t(`¡Perfecto! Te dejo el <b>${f}</b> en espera por 48 h para que vengas a conocer el salón.`,`Perfect! I'll hold <b>${f}</b> for 48 hours so you can come see the venue.`),tourS)}]),[t('Otra fecha','Another date'),()=>say(t('Decime qué fecha buscás y lo reviso en la agenda.','Tell me the date you have in mind and I\'ll check the calendar.'),()=>{st.wait='date'})]]))}
function tourS(){const S=D.salon.slots[L];say(t(`¿Cuándo te queda cómodo venir a conocer el salón?`,`When would you like to come see the venue?`),()=>opts(S.map(s=>[s,()=>{st.slot=s;nameAsk()}])))}
// ---------- flujo boutique ----------
function menuB(){opts([[t('Precios','Prices'),catB],[t('Talles disponibles','Sizes'),sizesB],[t('Agendar prueba','Book a fitting'),fitB],[t('Hablar con una persona','Talk to a person'),human]])}
function startB(){say(t(`¡Hola! 👋 Soy el asistente de <b>${biz()}</b>. ¿Estás buscando vestido para XV, boda o prom?`,`Hi! 👋 I'm the assistant for <b>${biz()}</b>. Are you shopping for a quinceañera, wedding or prom dress?`),()=>opts(D.boutique.cat.map(c=>[t(c.es,c.en),()=>{st.cat=c;dateB()}])))}
function dateB(){say(t(`¡Qué emoción! ¿Para qué fecha es el evento?`,`How exciting! When is the event?`),()=>opts([[t('En menos de 3 meses','In under 3 months'),()=>{st.when=1;catB()}],[t('En 3 a 6 meses','In 3–6 months'),()=>{st.when=2;catB()}],[t('En más de 6 meses','6+ months away'),()=>{st.when=3;catB()}]]))}
function catB(){const c=st.cat||D.boutique.cat[0];const rows=D.boutique.cat.map(x=>`<div class="row"><span>${t(x.es,x.en)}</span><span>${x.r}</span></div>`).join('');
 say(t(`Estos son los rangos de precio:`,`Here are our price ranges:`)+`<div class="card">${rows}</div>`+(st.when===1?t(`\nComo tu fecha está cerca, te conviene ver los modelos en stock: se pueden llevar en el día.`,`\nSince your date is close, our in-stock gowns are a great fit — you can take them home the same day.`):t(`\nCon tu fecha llegamos bien a pedir el modelo a medida (6 a 10 semanas).`,`\nYour timeline works for a made-to-order gown (6–10 weeks).`)),()=>opts([[t('Talles disponibles','Sizes'),sizesB],[t('Agendar prueba','Book a fitting'),fitB]]))}
function sizesB(){say(t(`Trabajamos del talle 0 al 26 y hacemos ajustes en el local. Si me decís tu talle aproximado, te separo los modelos para la prueba.`,`We carry sizes 0 to 26 and do alterations in-house. Tell me your approximate size and I'll pull gowns for your fitting.`),()=>opts([['0–6',fitB],['8–14',fitB],['16–26',fitB]]))}
function fitB(){const S=D.boutique.slots[L];say(t(`La prueba dura 1 hora y podés venir con hasta 4 acompañantes. ¿Qué horario te queda bien?`,`Fittings take one hour and you can bring up to 4 guests. Which time works for you?`),()=>opts(S.map(s=>[s,()=>{st.slot=s;nameAsk()}])))}
// ---------- flujo alquileres ----------
function menuR(){opts([[t('Precios','Prices'),itemsR],[t('Paquete fiesta','Party pack'),packR],[t('¿Tienen para mi fecha?','Available on my date?'),dateR],[t('Hablar con una persona','Talk to a person'),human]])}
function startR(){say(t('¡Hola! 👋 Soy el asistente de <b>'+biz()+'</b>. Te paso precios y disponibilidad al toque. ¿Qué necesitás para tu fiesta?','Hi! 👋 I\'m the assistant for <b>'+biz()+'</b>. I can get you prices and availability right away. What do you need for your party?'),()=>opts([[t('Inflables','Bounce houses'),itemsR],[t('Mesas y sillas','Tables & chairs'),itemsR],[t('Paquete completo','Full party pack'),packR]]))}
function itemsR(){const I=D.rentals.it;st.sel=st.sel||[];const rows=I.map(x=>'<div class="row"><span>'+t(x.es,x.en)+'</span><span>'+money(x.p)+'</span></div>').join('');
 say(t('Precios por día (incluyen entrega, instalación y retiro):','Daily prices (delivery, setup and pickup included):')+'<div class="card">'+rows+'</div>'+t('\n¿Qué querés sumar?','\nWhat would you like to add?'),()=>opts([...I.map((x,i)=>['+ '+t(x.es,x.en),()=>{st.pack=false;if(!st.sel.includes(i))st.sel.push(i);addedR()}]),[t('Ver paquete fiesta','See party pack'),packR]]))}
function addedR(){const I=D.rentals.it;const tot=st.sel.reduce((a,i)=>a+I[i].p,0);say(t('Agregado ✅ Llevás <b>'+money(tot)+'</b>. ¿Algo más?','Added ✅ You\'re at <b>'+money(tot)+'</b>. Anything else?'),()=>opts([...I.map((x,i)=>[i,x]).filter(([i])=>!st.sel.includes(i)).map(([i,x])=>['+ '+t(x.es,x.en),()=>{st.sel.push(i);addedR()}]),[t('Listo, ver fecha','Done, check date'),dateR]]))}
function packR(){const P=D.rentals.pk;st.pack=true;say(t('El más pedido: <b>'+P.es+'</b> por <b>'+money(P.p)+'</b> el día.','Our most popular: <b>'+P.en+'</b> for <b>'+money(P.p)+'</b> per day.'),()=>opts([[t('Lo quiero','I want it'),dateR],[t('Ver precios sueltos','See individual prices'),itemsR]]))}
function dateR(){const F=D.rentals.free[L];say(t('Para los próximos fines de semana tenemos libre: <b>'+F.join('</b>, <b>')+'</b>. ¿Cuál es tu fecha?','For the next weekends we\'re open: <b>'+F.join('</b>, <b>')+'</b>. What\'s your date?'),()=>opts([...F.map(f=>[f,()=>{st.date=f;zipR()}]),[t('Otra fecha','Another date'),()=>say(t('Decime la fecha y la reviso.','Tell me the date and I\'ll check it.'),()=>{st.wait='date'})]]))}
function zipR(){say(t('¡'+st.date+' disponible! 🎉 ¿Cuál es el código postal de la fiesta? Así calculo el envío.',st.date+' is available! 🎉 What\'s the ZIP code for the party? I\'ll calculate delivery.'),()=>{st.wait='zip'})}
function totalR(zip){const I=D.rentals.it;let rows='';let tot=0;if(st.pack||!(st.sel||[]).length){const P=D.rentals.pk;tot=P.p;rows+='<div class="row"><span>'+t('Paquete Fiesta','Party Pack')+'</span><span>'+money(P.p)+'</span></div>'}else{st.sel.forEach(i=>{tot+=I[i].p;rows+='<div class="row"><span>'+t(I[i].es,I[i].en)+'</span><span>'+money(I[i].p)+'</span></div>'})}
 const del=(parseInt(String(zip).slice(-1))||0)%2===1?35:0;tot+=del;rows+='<div class="row"><span>'+t('Envío','Delivery')+' ('+esc(String(zip))+')</span><span>'+(del?money(del):t('Gratis','Free'))+'</span></div><div class="row t"><span>Total</span><span>'+money(tot)+'</span></div>';
 say(t('Tu cotización 👇','Your quote 👇')+'<div class="card">'+rows+'</div>'+t('\nSe reserva con <b>'+money(Math.round(tot*.25))+'</b> (25%) y el resto el día de la entrega.','\nA <b>'+money(Math.round(tot*.25))+'</b> deposit (25%) reserves it; the balance is due on delivery day.'),()=>opts([[t('Reservar','Book it'),()=>say(t('¡Genial! ¿A nombre de quién hago la reserva?','Great! What name should the booking be under?'),()=>{st.wait='name'})],[t('Hablar con una persona','Talk to a person'),human]]))}
// ---------- común ----------
const MENU=()=>({salon:menuS,boutique:menuB,rentals:menuR})[TYPE]();
function nameAsk(){say(t(`¡Listo! ¿A nombre de quién lo agendo?`,`Great! What name should I book it under?`),()=>{st.wait='name'})}
function confirm(name){if(TYPE==='rentals')return say(t('Reservado ✅ a nombre de <b>'+esc(name)+'</b> para el <b>'+st.date+'</b>. Te mando el link para pagar la seña y la confirmación por acá. El día de la fiesta te avisamos cuando salimos con el pedido 🚚','Booked ✅ under <b>'+esc(name)+'</b> for <b>'+st.date+'</b>. I\'ll send the deposit link and confirmation here. On party day we\'ll text you when we\'re on the way 🚚'),MENU);const what=TYPE==='salon'?t('visita al salón','venue tour'):t('cita de prueba','fitting');
 say(t(`Agendado ✅ <b>${what}</b> el <b>${st.slot}</b> a nombre de <b>${esc(name)}</b>.`,`Booked ✅ <b>${what}</b> on <b>${st.slot}</b> for <b>${esc(name)}</b>.`)+(st.date?t(`\nY te guardamos el ${st.date}.`,`\nWe're also holding ${st.date} for you.`):'')+t(`\n\nEl equipo de ${biz()} te confirma por acá. ¿Te ayudo con algo más?`,`\n\nThe ${biz()} team will confirm here. Anything else I can help with?`),MENU)}
function human(){say(t(`Claro. Le paso tu mensaje al equipo de <b>${biz()}</b> con todo lo que hablamos, así no tenés que repetir nada. Te escriben en horario de atención. 🙌`,`Of course. I'm passing this chat to the <b>${biz()}</b> team with everything we covered, so you won't have to repeat yourself. They'll reply during business hours. 🙌`),MENU)}
function free(txt){const s=txt.toLowerCase();
 if(st.wait==='name'){st.wait=null;return confirm(txt)}
 if(st.wait==='zip'){st.wait=null;return totalR(txt.replace(/\D/g,'')||txt)}
 if(TYPE==='rentals'&&st.wait==='date'){st.wait=null;st.date=txt;return zipR()}
 if(TYPE==='rentals'){if(/paquete|pack|combo/.test(s))return packR();if(/precio|cu[aá]nto|cuesta|sale|price|cost|how much|brincol|inflable|bounce|mesa|silla|table|chair|carpa|tent/.test(s))return itemsR();if(/fecha|libre|disponib|date|available|s[aá]bado|domingo|saturday|sunday/.test(s))return dateR();if(/^\d{5}$/.test(s.trim()))return totalR(s.trim())}
 if(st.wait==='date'){st.wait=null;st.date=txt;return say(t(`Revisé la agenda: el <b>${esc(txt)}</b> está disponible 🎉 Te lo dejo en espera 48 h.`,`I checked the calendar: <b>${esc(txt)}</b> is open 🎉 I'll hold it for 48 hours.`),TYPE==='salon'?tourS:fitB)}
 if(/precio|cu[aá]nto|cuesta|sale|price|cost|how much|paquete|package/.test(s))return TYPE==='salon'?pkgS():catB();
 if(/fecha|libre|disponib|date|available|d[ií]a/.test(s))return TYPE==='salon'?dateS():dateB();
 if(/visita|conocer|tour|cita|prueba|fitting|appointment|agendar|book/.test(s))return TYPE==='salon'?tourS():fitB();
 if(/talle|talla|size/.test(s))return sizesB();
 if(/invitad|personas|capacidad|guests|capacity|people/.test(s))return TYPE==='salon'?(st.g=parseInt(s)||150,pkgS()):fitB();
 if(/persona|humano|due[ñn]o|llamar|human|someone|call|owner/.test(s))return human();
 if(/hola|buenas|hi|hello|hey/.test(s))return say(t('¡Hola! 😊 ¿En qué te ayudo?','Hi there! 😊 How can I help?'),MENU);
 say(t('Te ayudo con eso. Elegí una opción así te paso la info exacta 👇','Happy to help. Pick an option so I can give you the exact details 👇'),MENU)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('in');const v=i.value.trim();if(!v)return;i.value='';qr.innerHTML='';msg(esc(v),'in');free(v)};
function restart(){th.innerHTML=`<div class="ts">${T[L].ts}</div>`;qr.innerHTML='';st={};q=Promise.resolve();ui();
 msg(esc({salon:t('Hola! precio para quince? 🙏','Hi! how much for a quince? 🙏'),boutique:t('Hola! tienen vestidos de xv?','Hi! do you have quince dresses?'),rentals:t('Hola! cuánto el brincolín para el sábado?','Hi! how much is a bounce house for Saturday?')}[TYPE]),'in');
 ({salon:startS,boutique:startB,rentals:startR})[TYPE]()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;restart()});
restart();
</script>
